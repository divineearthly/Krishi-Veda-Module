<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4CAF50">
<title>Krishi-Veda | कृषि-वेद</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Arial', sans-serif; background: #f1f8e9; color: #333; }
.header { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; padding: 15px; text-align: center; font-size: 20px; }
.container { max-width: 500px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 12px; padding: 15px; margin: 10px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.btn { background: #4CAF50; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 16px; width: 100%; cursor: pointer; margin: 5px 0; }
.btn:active { background: #388E3C; }
.btn-outline { background: white; color: #4CAF50; border: 2px solid #4CAF50; }
.input-group { margin: 10px 0; }
.input-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #666; }
.input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
.result { white-space: pre-wrap; font-size: 14px; line-height: 1.6; max-height: 400px; overflow-y: auto; }
.loading { text-align: center; color: #4CAF50; padding: 20px; }
.sutra-badge { display: inline-block; background: #E8F5E9; color: #2E7D32; padding: 4px 8px; border-radius: 12px; font-size: 11px; margin: 2px; }
.lang-select { display: flex; gap: 5px; margin: 10px 0; flex-wrap: wrap; }
.lang-btn { padding: 8px 12px; border-radius: 15px; border: 1px solid #4CAF50; background: white; color: #4CAF50; font-size: 12px; cursor: pointer; }
.lang-btn.active { background: #4CAF50; color: white; }
.footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="header">🌾 Krishi-Veda | कृषि-वेद</div>
<div class="container">
  <div class="lang-select">
    <button class="lang-btn active" onclick="setLang('en')">English</button>
    <button class="lang-btn" onclick="setLang('hi')">हिंदी</button>
    <button class="lang-btn" onclick="setLang('bn')">বাংলা</button>
    <button class="lang-btn" onclick="setLang('as')">অসমীয়া</button>
  </div>

  <div class="card">
    <h3>📊 Soil Sensors</h3>
    <div class="input-group"><label>pH</label><input type="number" id="ph" value="6.5" step="0.1"></div>
    <div class="input-group"><label>Nitrogen (N)</label><input type="number" id="n" value="35"></div>
    <div class="input-group"><label>Phosphorus (P)</label><input type="number" id="p" value="28"></div>
    <div class="input-group"><label>Potassium (K)</label><input type="number" id="k" value="40"></div>
    <div class="input-group"><label>Soil Type</label>
      <select id="soil_type">
        <option value="loamy">Loamy</option>
        <option value="alluvial">Alluvial</option>
        <option value="clay">Clay</option>
        <option value="sandy">Sandy</option>
      </select>
    </div>
  </div>

  <button class="btn" onclick="getPlan(false)">⚡ Quick Plan (Instant)</button>
  <button class="btn btn-outline" onclick="getPlan(true)">🤖 AI Plan (30-60s)</button>

  <div class="card" id="result" style="display:none;">
    <h3 id="resultTitle">📋 Vedic Plan</h3>
    <div class="result" id="resultContent"></div>
  </div>
  <div class="loading" id="loading" style="display:none;">🕉️ Consulting Vedic kernels...</div>
</div>
<div class="footer">Ahimsa-108 Protocol Active | Offline-First | Silchar, Assam</div>

<script>
let lang = 'en';

async function getPlan(useSlm) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  
  const data = {
    sensor_data: [
      parseFloat(document.getElementById('ph').value),
      parseFloat(document.getElementById('n').value),
      parseFloat(document.getElementById('p').value),
      parseFloat(document.getElementById('k').value),
      50, 2.0, 0.3, 28
    ],
    soil_type: document.getElementById('soil_type').value,
    use_slm: useSlm
  };
  
  try {
    const resp = await fetch('/api/v1/plan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const json = await resp.json();
    displayResult(json);
  } catch(e) {
    document.getElementById('resultContent').innerHTML = 'Error: ' + e.message;
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('result').style.display = 'block';
}

function displayResult(data) {
  const p = data.vedic_plan;
  const s = data.sutra_computations;
  let html = '';
  
  html += '<b>🌱 Wellness:</b> ' + p.wellness_score.toFixed(1) + '/100<br>';
  html += '<b>📈 Yield:</b> ' + p.yield_index.toFixed(1) + '/100<br>';
  html += '<b>🌙 Paksha:</b> ' + p.paksha_advice + '<br>';
  html += '<b>🌾 Crops:</b> ' + (p.primary_crops||[]).join(', ') + '<br>';
  html += '<b>⚠️ Stress:</b> ' + p.stress_code.toFixed(1) + ' (Ahimsa: ' + (p.ahimsa_108_triggered?'TRIGGERED':'OK') + ')<br>';
  html += '<b>📋 Advice:</b> ' + (p.recommendations||[]).join('<br>') + '<br>';
  
  html += '<br><b>🕉️ Sutras:</b><br>';
  html += '<span class="sutra-badge">Anurupyena N×' + s.anurupyena.npk_scale_factors.N.toFixed(2) + '</span> ';
  html += '<span class="sutra-badge">Nikhilam ' + s.nikhilam.npk_deficit_ppm.toFixed(1) + 'ppm</span> ';
  html += '<span class="sutra-badge">Wellness ' + s.gunakasamuccaya.wellness_index.toFixed(0) + '</span> ';
  
  if (data.slm_advice) {
    html += '<br><br><b>🤖 AI Advice:</b><br>' + (data.slm_advice.advice || '').substring(0, 500);
    html += '<br><small>Model: ' + data.slm_advice.model_used + ' (' + data.slm_advice.inference_seconds + 's)</small>';
  }
  
  document.getElementById('resultContent').innerHTML = html;
}

function setLang(l) { lang = l; }
</script>
</body>
</html>
