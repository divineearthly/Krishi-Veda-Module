<!DOCTYPE html>
<html>
<head>
    <title>Krishi-Veda | Farmer AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f5f5f0; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #2d5016; text-align: center; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #2d5016; color: white; border: none; font-weight: bold; }
        .advice { background: #e8f5e9; padding: 15px; border-radius: 8px; margin: 10px 0; white-space: pre-line; }
        .lang-bar { text-align: center; margin: 10px 0; }
        .lang-btn { padding: 8px 15px; margin: 3px; border-radius: 20px; border: 1px solid #2d5016; background: white; color: #2d5016; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Krishi-Veda</h1>
        <p style="text-align:center;color:#666">Sovereign Agricultural AI</p>
        
        <div class="lang-bar">
            <button class="lang-btn" onclick="setLang('en')">English</button>
            <button class="lang-btn" onclick="setLang('hi')">हिंदी</button>
            <button class="lang-btn" onclick="setLang('as')">অসমীয়া</button>
            <button class="lang-btn" onclick="setLang('bn')">বাংলা</button>
        </div>
        
        <div class="card">
            <input type="text" id="query" placeholder="Ask your farming question...">
            <button onclick="askKrishi()">Get Advice</button>
            <div id="result" class="advice" style="display:none"></div>
        </div>
        
        <div class="card">
            <h3>📊 Quick Info</h3>
            <button onclick="getWeather()">Weather</button>
            <button onclick="getPrices()">Market Prices</button>
            <div id="info"></div>
        </div>
    </div>
    
    <script>
        const API = '';
        
        async function askKrishi() {
            const q = document.getElementById('query').value;
            const r = await fetch(`${API}/ask?query=${encodeURIComponent(q)}`);
            const d = await r.json();
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerText = d.advice || JSON.stringify(d);
        }
        
        async function getWeather() {
            const r = await fetch(`${API}/weather?lat=24.8333&lon=92.7789`);
            const d = await r.json();
            document.getElementById('info').innerHTML = `
                🌡️ ${d.temperature_c}°C | 💧 ${d.humidity_pct}%
                🌧️ Rain: ${d.rainfall_mm}mm | 🌱 Soil: ${(d.soil_moisture*100).toFixed(0)}%
            `;
        }
        
        async function getPrices() {
            const r = await fetch(`${API}/market-prices?state=Assam&district=Kamrup`);
            const d = await r.json();
            let html = '';
            for (const [crop, price] of Object.entries(d)) {
                html += `${crop}: ${price}<br>`;
            }
            document.getElementById('info').innerHTML = html;
        }
        
        function setLang(lang) {
            alert('Language: ' + lang + ' (API supports this)');
        }
    </script>
</body>
</html>
