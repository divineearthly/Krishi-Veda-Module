name: Build Krishi-Veda APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Buildozer
        run: |
          pip install buildozer
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev zip unzip openjdk-17-jdk
      
      - name: Build APK
        run: |
          cd Krishi-Veda-Module
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KrishiVeda-APK
          path: Krishi-Veda-Module/bin/*.apk
