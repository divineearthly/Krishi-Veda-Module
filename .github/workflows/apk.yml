name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build APK
        run: |
          pip install buildozer cython
          sudo apt-get update -y && sudo apt-get install -y openjdk-17-jdk autoconf automake libtool
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Krishi-Veda-APK
          path: bin/*.apk
