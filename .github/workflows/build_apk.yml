name: Build Krishi-Veda APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip python3-dev \
          build-essential libssl-dev libffi-dev \
          libncurses5-dev zlib1g-dev zlib1g \
          libsqlite3-dev libreadline-dev libbz2-dev \
          libgdbm-dev liblzma-dev tk-dev \
          openjdk-17-jdk git cmake autoconf libtool \
          pkg-config zip unzip
    
    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv flask requests
    
    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Krishi-Veda-APK
        path: bin/*.apk
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/heads/main')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly
        name: Nightly Build
        files: bin/*.apk
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
