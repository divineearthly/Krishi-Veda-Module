name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip python3-dev build-essential git autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev zip unzip
          pip install buildozer cython virtualenv
      
      - name: Run Buildozer init (downloads SDK)
        run: |
          cd $GITHUB_WORKSPACE
          buildozer init 2>/dev/null || true
          # Let Buildozer start downloading SDK, then kill it after 60s
          timeout 60 buildozer android debug 2>&1 || true
        timeout-minutes: 3
      
      - name: Accept license in Buildozer SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses
            $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-33"
          fi
          # Also try the tools/bin path
          if [ -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            yes | $SDK_DIR/tools/bin/sdkmanager --licenses
          fi
      
      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          yes | buildozer android debug
        timeout-minutes: 50
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DivineEarthly-APK
          path: bin/*.apk
      
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Divine-Earthly v${{ github.run_number }}"
          body: "📱 Krishi-Veda + Water Guardian APK"
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
