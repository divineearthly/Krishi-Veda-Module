name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install C/C++ Autotools Dependencies (Ubuntu 24.04 Fix)
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libtool-bin pkg-config libffi-dev
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libtool libtool-bin autoconf automake pkg-config -qq python3-pip python3-dev build-essential git autoconf automake libtool pkg-config zlib1g zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev zip unzip
      - run: pip install buildozer cython virtualenv flask requests
      - name: Build with system Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
          yes | buildozer -v android debug
        timeout-minutes: 50
      - run: find . -name "*.apk" -type f
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: "**/*.apk"
      - if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "Krishi-Veda #${{ github.run_number }}"
          body: "🕉️ Free for all farmers"
          files: "**/*.apk"
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
