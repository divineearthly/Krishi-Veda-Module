name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip python3-dev build-essential \
            git autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev zip unzip lld
      
      - name: Install Python packages
        run: pip install --upgrade buildozer cython virtualenv
      
      - name: Build APK (auto-accept licenses)
        run: |
          export ANDROID_SDK_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          cd $GITHUB_WORKSPACE
          yes | buildozer android debug
        timeout-minutes: 50
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DivineEarthly-APK
          path: bin/*.apk
      
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Divine-Earthly v${{ github.run_number }}"
          body: |
            ## 📱 Download & Install
            
            ### Features:
            🌾 Krishi-Veda | 🛡️ Water Guardian | 🕉️ 8 Sutras | 📵 Offline
            🗣️ Voice | 🦠 Disease ID | 💰 Mandi Prices | 🌦️ 7-Day Forecast
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
