name: Build Krishi-Veda APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip python3-dev build-essential \
            git autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            zip unzip

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv flask requests

      - name: Initialize Buildozer & Download SDK
        run: |
          cd $GITHUB_WORKSPACE
          yes | buildozer init 2>/dev/null || true
        timeout-minutes: 5

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR
          # Try multiple possible sdkmanager locations
          for MANAGER in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [ -f "$MANAGER" ]; then
              yes | $MANAGER --licenses
              $MANAGER "build-tools;34.0.0" "platforms;android-33"
            fi
          done
        timeout-minutes: 10

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          yes | buildozer android debug
        timeout-minutes: 45

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krishi-Veda-APK
          path: bin/*.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Krishi-Veda v${{ github.run_number }}"
          body: |
            📱 Krishi-Veda APK — Sovereign Agricultural AI
            
            🕉️ Free for all farmers. Offline. Dharma-licensed.
            
            ### What's New
            - 16 Vedic Sutras as ML kernels
            - Vriksh Ayurveda agricultural algorithms
            - Panchakosha cosmic agriculture framework
            - Ahimsa-108 ethical constraint
            - Auto-updating via GitHub
            
            ### Install
            1. Download APK
            2. Install on Android 7.0+
            3. Open — no setup needed
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
