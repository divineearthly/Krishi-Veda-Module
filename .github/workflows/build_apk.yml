name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip python3-dev build-essential git autoconf automake libtool pkg-config zlib1g zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev zip unzip
      - run: pip install buildozer cython virtualenv flask requests
      - run: |
          export CFLAGS="-I/usr/include"
          export LDFLAGS="-L/usr/lib/x86_64-linux-gnu"
          yes | buildozer android debug
        timeout-minutes: 75
      - run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK"
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: "**/*.apk"
      - if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "Krishi-Veda #${{ github.run_number }}"
          body: "🕉️ Free for all farmers"
          files: "**/*.apk"
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
