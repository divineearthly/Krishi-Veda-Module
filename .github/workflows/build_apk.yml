name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip python3-dev build-essential \
            git autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev zip unzip lld
      
      - name: Install buildozer
        run: pip install buildozer cython virtualenv
      
      - name: Pre-accept all Android SDK licenses
        run: |
          mkdir -p $HOME/.android
          echo -e "\n84831d9409646a918e30573bab4c9c91346d8abd" > $HOME/.android/sdk_license.sha1 || true
          # Create a script that Buildozer will use
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          # Set env vars that force license acceptance
          echo "export ANDROID_SDK_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $HOME/.bashrc
          echo "y" > /tmp/yes.txt
      
      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          # Trick: pre-create the license file that sdkmanager checks
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831d9409646a918e30573bab4c9c91346d8abd" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          # Now run buildozer
          yes "" | buildozer android debug 2>&1 || true
          # Check if APK was created
          find . -name "*.apk" -type f
        timeout-minutes: 50
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DivineEarthly-APK
          path: bin/*.apk
