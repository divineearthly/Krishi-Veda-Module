name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev build-essential \
            git autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev openjdk-17-jdk zip unzip
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv
      
      - name: Debug - List files
        run: |
          pwd
          ls -la
          ls -la .buildozer 2>/dev/null || echo "No .buildozer yet"
      
      - name: Build APK with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer android debug
      
      - name: Find and upload APK
        run: |
          echo "Searching for APK..."
          find . -name "*.apk" -type f
          mkdir -p output
          find . -name "*.apk" -type f -exec cp {} output/ \;
          ls -la output/
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivineEarthly-APK
          path: output/*.apk
