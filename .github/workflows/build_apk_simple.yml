name: Build APK (Simple)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libtool libtool-bin autoconf automake pkg-config -qq python3-pip python3-dev build-essential git zlib1g-dev libncurses-dev cmake libffi-dev libltdl-dev libssl-dev zip unzip
          pip install python-for-android
      - run: |
          p4a create --requirements=python3,flask,requests --arch=arm64-v8a \
            --name=KrishiVeda --package=org.earthly.krishiveda \
            --bootstrap=webview --port=5000 \
            --private=./ --dist_name=krishiveda
      - uses: actions/upload-artifact@v4
        with: {name: APK, path: "*.apk"}
